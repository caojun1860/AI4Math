<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>AI时代下的数学思考笔记</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #e6f0fa;  /* 浅蓝色护眼背景 */
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            color: #1a2a3a;
            line-height: 1.5;
            padding: 2rem 1.5rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .header h1 {
            font-size: 2.4rem;
            font-weight: 600;
            letter-spacing: -0.01em;
            background: linear-gradient(135deg, #1a5276, #2e86c1);  /* 深蓝到亮蓝渐变 */
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        .header p {
            color: #2c5f7a;
            margin-top: 0.5rem;
            font-size: 1.05rem;
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
        }

        .task-group {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(2px);
            border-radius: 2rem;
            padding: 1.8rem 1.5rem;
            margin-bottom: 2.5rem;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.03);
            border: 1px solid rgba(100, 150, 200, 0.25);
        }

        .task-group h2 {
            font-size: 1.7rem;
            font-weight: 600;
            color: #1a4a6a;
            border-left: 5px solid #5b9bd5;
            padding-left: 1rem;
            margin-bottom: 1.2rem;
        }

        .subtasks-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.2rem;
        }

        .subtask-card {
            background: white;
            border-radius: 1.2rem;
            padding: 2rem 2rem;
            transition: all 0.2s ease;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
            border: 1px solid #d4e4f0;
        }

        .subtask-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 20px rgba(40, 100, 180, 0.10);
            border-color: #a8c8e8;
        }

        .subtask-title {
            font-weight: 700;
            font-size: 1.3rem;
            color: #1a3a5a;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: baseline;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .badge {
            background-color: #dceaf5;
            padding: 0.2rem 0.8rem;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 500;
            color: #1a5a7a;
        }

        .subtask-desc {
            font-size: 1.0rem;
            color: #2a4a5a;
            margin-bottom: 1.2rem;
            line-height: 1.5;
        }

        .subtask-link {
            display: inline-block;
            background: #e6f0fa;
            padding: 0.5rem 1.5rem;
            border-radius: 40px;
            text-decoration: none;
            font-size: 1.0rem;
            font-weight: 500;
            color: #1a6a8a;
            transition: 0.2s;
            border: 1px solid #c4d8ec;
        }

        .subtask-link:hover {
            background: #cfe0f0;
            color: #0f4a6a;
            border-color: #8ab8d8;
        }

        .footer-note {
            margin-top: 2rem;
            text-align: center;
            font-size: 0.85rem;
            color: #3a6a8a;
            background: rgba(200, 220, 240, 0.4);
            padding: 1rem;
            border-radius: 2rem;
        }

        hr {
            margin: 1rem 0;
            border: none;
            height: 1px;
            background: linear-gradient(to right, #c8dce8, transparent);
        }

        @media (max-width: 700px) {
            body {
                padding: 1rem;
            }
            .task-group {
                padding: 1rem;
            }
            .subtasks-grid {
                grid-template-columns: 1fr;
            }
            .subtask-card {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>📐 AI时代下的数学思考笔记</h1>
        <p>从认知基座到人才培养 · 系统探讨AI时代的数学学习、研究、教学与创造</p>
    </div>

    <div id="app"></div>

    <div class="footer-note">
        💡 每篇文章均包含完整论述与核心洞察，持续更新中。<br>
        🌿 整个系列遵循「思行合一」的理念 —— 认知与行动协同演化，在AI时代重新定义数学的边界。
    </div>
</div>

<script>
    // 六篇论文的数据 —— 按照认识论→操作论的顺序排列
    const tasksData = [
        {
            title: "第一篇 · 认知基座",
            subtasks: [
                {
                    id: "article1",
                    name: "AI与人类智能的本质差异",
                    desc: "提出「三个世界」认知框架，剖析连接主义智能与时间性智能的根本分野，建立「扑克牌-概念踏板」模型，阐释压缩即涌现的认知原理。",
                    link: "article1.html"
                }
            ]
        },
        {
            title: "第二篇 · 知识生态",
            subtasks: [
                {
                    id: "article2",
                    name: "AI时代知识生产的结构性转变",
                    desc: "描绘从「学科树」到「学科网」的演化趋势，提出学者角色的新分化 —— 封装者、调用者、组合者，探讨思维经济化与知识模块化的时代意义。",
                    link: "article2.html"
                }
            ]
        },
        {
            title: "第三篇 · 项目与开创",
            subtasks: [
                {
                    id: "article3",
                    name: "AI时代有价值的项目从何而来",
                    desc: "总结项目来源的四个维度（观察世界、提炼问题、注重交叉、技术驱动），提出好项目的五条标准，论证从「开创者」到「催化者」的范式转移。",
                    link: "article3.html"
                }
            ]
        },
        {
            title: "第四篇 · 研究工作流",
            subtasks: [
                {
                    id: "article4",
                    name: "思行工作流：五维认知框架与四步循环",
                    desc: "系统呈现「思行工作流」的五模块架构（对话、图谱、可视化、验证、实践），以及贯穿始终的四步认知循环（提问、整理、蒸馏、封装）。",
                    link: "article4.html"
                }
            ]
        },
        {
            title: "第五篇 · 教学重构",
            subtasks: [
                {
                    id: "article5",
                    name: "从讲解员到策展人：AI时代数学教育的范式革命",
                    desc: "以「博物馆类比」揭示教学角色的根本转变，倡导项目式学习与成果展示评价，探讨「课堂已死」背后的大学重生路径。",
                    link: "article5.html"
                }
            ]
        },
        {
            title: "第六篇 · 人才培养",
            subtasks: [
                {
                    id: "article6",
                    name: "AI时代数学人才的培养路径重构",
                    desc: "区分本科生、研究生、博士生的三阶段培养目标，强调项目驱动、复合能力与终身学习，以马骁的成长轨迹作为典型案例。",
                    link: "article6.html"
                }
            ]
        }
    ];

    const container = document.getElementById('app');
    tasksData.forEach(task => {
        const groupDiv = document.createElement('div');
        groupDiv.className = 'task-group';
        groupDiv.innerHTML = `<h2>${task.title}</h2><div class="subtasks-grid"></div>`;
        const grid = groupDiv.querySelector('.subtasks-grid');
        task.subtasks.forEach(sub => {
            const card = document.createElement('div');
            card.className = 'subtask-card';
            card.innerHTML = `
                <div class="subtask-title">
                    <span>📌 ${sub.name}</span>
                    <span class="badge">核心论文</span>
                </div>
                <div class="subtask-desc">${sub.desc}</div>
                <a class="subtask-link" href="${sub.link}" target="_blank">📖 阅读全文 →</a>
            `;
            grid.appendChild(card);
        });
        container.appendChild(groupDiv);
    });
</script>
</body>
</html>
