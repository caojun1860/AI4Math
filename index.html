<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Kolmogorov方程的调和分析方法</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #eef4ea;
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            color: #1e2a1e;
            line-height: 1.5;
            padding: 2rem 1.5rem;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .header h1 {
            font-size: 2.2rem;
            font-weight: 600;
            letter-spacing: -0.01em;
            background: linear-gradient(135deg, #2b5e2b, #1e3a1e);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        .header p {
            color: #3b5c3b;
            margin-top: 0.5rem;
            font-size: 1.05rem;
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
        }

        .task-group {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(2px);
            border-radius: 2rem;
            padding: 1.8rem 1.5rem;
            margin-bottom: 2.5rem;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.03);
            border: 1px solid rgba(100, 120, 80, 0.2);
        }

        .task-group h2 {
            font-size: 1.7rem;
            font-weight: 600;
            color: #2d4a2d;
            border-left: 5px solid #5c9e5c;
            padding-left: 1rem;
            margin-bottom: 1.2rem;
        }

        /* 每个主任务只有一个子任务，使用单列布局，卡片更大 */
        .subtasks-grid {
            display: grid;
            grid-template-columns: 1fr;   /* 单列，每个子任务独占一行 */
            gap: 1.2rem;
        }

        .subtask-card {
            background: white;
            border-radius: 1.2rem;
            padding: 2rem 2rem;           /* 增加内边距，让卡片更大 */
            transition: all 0.2s ease;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2eeda;
        }

        .subtask-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 20px rgba(60, 80, 40, 0.1);
            border-color: #bdd8ad;
        }

        .subtask-title {
            font-weight: 700;
            font-size: 1.3rem;            /* 标题字体放大 */
            color: #1e3a1e;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: baseline;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .badge {
            background-color: #e7f3e3;
            padding: 0.2rem 0.8rem;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 500;
            color: #3b6e3b;
        }

        .subtask-desc {
            font-size: 1.0rem;            /* 描述字体放大 */
            color: #3a563a;
            margin-bottom: 1.2rem;
            line-height: 1.5;
        }

        .subtask-link {
            display: inline-block;
            background: #eef4ea;
            padding: 0.5rem 1.5rem;
            border-radius: 40px;
            text-decoration: none;
            font-size: 1.0rem;
            font-weight: 500;
            color: #2b6e2b;
            transition: 0.2s;
            border: 1px solid #cce0c0;
        }

        .subtask-link:hover {
            background: #d9e8d2;
            color: #1f4f1f;
            border-color: #aacb98;
        }

        .footer-note {
            margin-top: 2rem;
            text-align: center;
            font-size: 0.85rem;
            color: #5f7a5a;
            background: rgba(200, 220, 185, 0.4);
            padding: 1rem;
            border-radius: 2rem;
        }

        hr {
            margin: 1rem 0;
            border: none;
            height: 1px;
            background: linear-gradient(to right, #d0e0c5, transparent);
        }

        @media (max-width: 700px) {
            body {
                padding: 1rem;
            }
            .task-group {
                padding: 1rem;
            }
            .subtasks-grid {
                grid-template-columns: 1fr;
            }
            .subtask-card {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1> Kolmogorov方程的调和分析方法</h1>
        <p>大量粒子的随机运动的演化规律<br> </p>
    </div>

    <div id="app"></div>
    <div class="footer-note">
        💡 每个章节均设有独立详情页，包含完整论述、关键结论及附件下载链接。<br>
        🌿 本项目遵循陶哲轩“新数学工作流”理念 — 拆解 → 分配 → 验证 → 消化 → 沉淀
    </div>
</div>

<script>
    // 任务数据：6个主任务（章节），每个主任务仅含1个子任务
    const tasksData = [
        {
            title: "第1章 · 物理背景与模型建立",
            subtasks: [
                { 
                    id: "ch1", 
                    name: "从随机游走到Kolmogorov方程", 
                    desc: "推导Kolmogorov前向方程（Fokker-Planck）的物理直觉与数学形式，建立粒子系统的统计描述。",
                    link: "chapt1.html"
                }
            ]
        },
        {
            title: "第2章 · 基本解与Green函数",
            subtasks: [
                { 
                    id: "ch2", 
                    name: "显式解与基本解的性质", 
                    desc: "通过Fourier变换求解基本解，分析其高斯型衰减与正则性，为后续估计奠定基础。",
                    link: "chapt2.html"
                }
            ]
        },
        {
            title: "第3章 · 积分核的精细估计",
            subtasks: [
                { 
                    id: "ch3", 
                    name: "积分核的Lp-Lq估计", 
                    desc: "建立Kolmogorov半群的积分核在混合范数空间中的有界性，发展调和分析工具。",
                    link: "chapt3.html"
                }
            ]
        },
        {
            title: "第4章 · Littlewood-Paley理论与各向异性",
            subtasks: [
                { 
                    id: "ch4", 
                    name: "各向异性的频率分解", 
                    desc: "引入适应Kolmogorov算子的Littlewood-Paley分解，刻画速度与位置变量的不同尺度。",
                    link: "chapt4.html"
                }
            ]
        },
        {
            title: "第5章 · 解的正则性与光滑效应",
            subtasks: [
                { 
                    id: "ch5", 
                    name: "Gevrey类与超解析性", 
                    desc: "证明解在长时间下的光滑性提升，利用算子半群和复插值方法。",
                    link: "chapt5.html"
                }
            ]
        },
        {
            title: "第6章 · 渐近行为与应用",
            subtasks: [
                { 
                    id: "ch6", 
                    name: "长时间渐近与湍流模型", 
                    desc: "研究解的长时间收敛性，并讨论在流体力学湍流模型中的应用前景。",
                    link: "chapt6.html"
                }
            ]
        }
    ];

    const container = document.getElementById('app');
    tasksData.forEach(task => {
        const groupDiv = document.createElement('div');
        groupDiv.className = 'task-group';
        groupDiv.innerHTML = `<h2>${task.title}</h2><div class="subtasks-grid"></div>`;
        const grid = groupDiv.querySelector('.subtasks-grid');
        task.subtasks.forEach(sub => {
            const card = document.createElement('div');
            card.className = 'subtask-card';
            card.innerHTML = `
                <div class="subtask-title">
                    <span>📌 ${sub.name}</span>
                    <span class="badge">核心章节</span>
                </div>
                <div class="subtask-desc">${sub.desc}</div>
                <a class="subtask-link" href="${sub.link}" target="_blank">📖 查看详情 →</a>
            `;
            grid.appendChild(card);
        });
        container.appendChild(groupDiv);
    });
</script>
</body>
</html>
